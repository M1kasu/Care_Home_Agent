[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zte-smart-home-agent"
version = "0.1.0"
description = "端侧智能家居 Agent 比赛版 Demo"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python==0.3.19",
    "numpy<2.3",
]

[project.optional-dependencies]
demo = [
    "gradio>=4.0,<6",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["smart_home_agent*"]
exclude = ["demo*", "docs*", "pptx_work*", "scripts*", "tests*", "zhijia*"]

[tool.pytest.ini_options]
pythonpath = ["."]
